<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos - Pet Shop</title>
</head>

<body>
  <header class="cabecalho">
    <a href="login.html" class="logo-link" aria-label="Acessar painel administrativo">
      <h1 class="logo">
        <img src="../assets/logo.png" alt="Logo do Pet Shop Amigo">
        <span>Pet Shop</span>
      </h1>
    </a>

    <nav>
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="conteudo-principal">
    <section class="secao-vitrine">
      <div class="cabecalho-categoria-selecionada">
        <a href="index.html" class="link-voltar">← Voltar ao início</a>
        <h2 id="tituloCategoria" class="titulo-produtos-categoria">Produtos</h2>
      </div>

      <!-- Barra de filtros rápidos por categoria -->
      <div class="grade-categorias filtros-produtos" id="barraCategorias">
        <button class="item-categoria btn-filtro" data-categoria="todos">
          <div class="icone-categoria">🐾</div>
          <span>Todos</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="cachorro">
          <div class="icone-categoria">🐶</div>
          <span>Cachorro</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="gato">
          <div class="icone-categoria">🐱</div>
          <span>Gato</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="passaro">
          <div class="icone-categoria">🐦</div>
          <span>Pássaro</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="peixe">
          <div class="icone-categoria">🐟</div>
          <span>Peixe</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="outros">
          <div class="icone-categoria">🐰</div>
          <span>Outros pets</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="casa">
          <div class="icone-categoria">🏠</div>
          <span>Casa</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="jardim">
          <div class="icone-categoria">🌱</div>
          <span>Jardim</span>
        </button>
        <button class="item-categoria btn-filtro" data-categoria="piscina">
          <div class="icone-categoria">🏊</div>
          <span>Piscina</span>
        </button>
      </div>

      <!-- Grade onde aparecem os produtos filtrados -->
      <div id="gradeProdutos" class="grade-produtos-catalogo"></div>
      
      <p id="mensagemVazia" class="agenda-vazia">Nenhum produto encontrado nesta categoria.</p>
    </section>
  </main>

  <footer class="rodape">
    <p>© 2026 - Alexandre Alencar</p>
  </footer>

  <script type="module" src="/produtos.ts"></script>
</body>
</html>
