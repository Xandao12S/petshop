<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Pet Shop Amigo</title>
</head>

<body class="pagina-login">
  <header class="cabecalho">
    <a href="../index.html" class="logo-link" aria-label="Voltar ao início">
      <h1 class="logo">
        <img src="../assets/logo.png" alt="Logo do Pet Shop Amigo">
        <span>Pet Shop Amigo</span>
      </h1>
    </a>
  </header>

  <main>
    <section class="secao-login">
      <h2>Login do Administrador</h2>

      <form id="formLogin">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" name="email" placeholder="seuemail@email.com" required>

        <p id="erroLogin" class="erro-login"></p>

        <button type="submit" class="modal-enviar">Entrar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>© 2026 - Pet Shop Amigo</p>
  </footer>

  <script type="module" src="/login.ts"></script>
</body>
</html>
